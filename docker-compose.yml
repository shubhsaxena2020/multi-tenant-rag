services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      # Write snapshots into the mounted storage volume so they persist on the host and
      # are recoverable via an absolute path (v9-2 Backup & DR).
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ulimits:
      memlock:
        soft: -1
        hard: -1

  redis:
    # Optional: shared rate-limit state when running >1 app replica.
    # Without it, each replica enforces its own per-instance limit.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["ratelimit"]

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_URL: sqlite:///./rag_tenants.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      USE_REAL_EMBEDDER: ${USE_REAL_EMBEDDER:-0}
      USE_REAL_RERANKER: ${USE_REAL_RERANKER:-0}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RATE_PER_TENANT_PER_MIN: ${RATE_PER_TENANT_PER_MIN:-600}
      RATE_PER_IP_PER_MIN: ${RATE_PER_IP_PER_MIN:-120}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
