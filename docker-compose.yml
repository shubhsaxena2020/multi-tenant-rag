services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    # Optional: shared rate-limit state when running >1 app replica.
    # Without it, each replica enforces its own per-instance limit.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["ratelimit"]

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_URL: sqlite:///./rag_tenants.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      USE_REAL_EMBEDDER: ${USE_REAL_EMBEDDER:-0}
      USE_REAL_RERANKER: ${USE_REAL_RERANKER:-0}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RATE_PER_TENANT_PER_MIN: ${RATE_PER_TENANT_PER_MIN:-600}
      RATE_PER_IP_PER_MIN: ${RATE_PER_IP_PER_MIN:-120}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
