services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      # Write snapshots into the mounted storage volume so they persist on the host and
      # are recoverable via an absolute path (v9-2 Backup & DR).
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ulimits:
      memlock:
        soft: -1
        hard: -1

  redis:
    # Optional: shared rate-limit state when running >1 app replica.
    # Without it, each replica enforces its own per-instance limit.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["ratelimit"]

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_URL: sqlite:///./rag_tenants.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      USE_REAL_EMBEDDER: ${USE_REAL_EMBEDDER:-0}
      USE_REAL_RERANKER: ${USE_REAL_RERANKER:-1}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_PREFIX_STYLE: ${EMBED_PREFIX_STYLE:-e5}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RATE_PER_TENANT_PER_MIN: ${RATE_PER_TENANT_PER_MIN:-600}
      RATE_PER_IP_PER_MIN: ${RATE_PER_IP_PER_MIN:-120}
    depends_on:
      - qdrant
    restart: unless-stopped

  # ---------------- v8 P0 monitoring/alerting ----------------
  # Bring up with: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    profiles: ["monitoring"]

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped
    profiles: ["monitoring"]

  alert-webhook:
    # Local Alertmanager webhook sink -> /var/log/rag-alerts.log (no external integration needed).
    image: python:3.11-slim
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir 2>/dev/null; python3 deploy/alert_webhook.py"]
    volumes:
      - .:/app
    ports:
      - "9099:9099"
    restart: unless-stopped
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  qdrant_data:
  prom_data:
  grafana_data:
