# Prometheus alerting rules for the multi-tenant RAG service (v9-5 SLOs/alerting).
# Wire this file via `rule_files:` in prometheus.yml and a corresponding Alertmanager
# receiver (email/Slack/PagerDuty). These are grounded in the metrics exported by
# app/observability.py + app/resilience.py.

groups:
  - name: rag-availability
    rules:
      # P0 (v8): Qdrant is DOWN. This is the exact incident the audit found undiscovered for
      # 2 days. Prometheus scrapes Qdrant's native :6333/metrics; if the target is unreachable
      # `up` goes to 0 within one scrape interval (~15s) → paged within minutes.
      - alert: QdrantDown
        expr: up{service="qdrant"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Qdrant vector store is DOWN"
          description: "Qdrant :6333/metrics not reachable for 1m. All retrieval/ingestion fails (degraded mode). Investigate the qdrant container + disk."

      # P0 (v8): The RAG app itself is down/unreachable.
      - alert: RAGAppDown
        expr: up{service="rag-app"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "RAG app is DOWN"
          description: "app:8000/metrics not reachable for 1m. The public API is unavailable."

  - name: rag-slo
    rules:
      # Availability SLO: >0.5% of requests are 5xx over a 10m window.
      - alert: RAGAvailabilitySLOBreach
        expr: |
          (
            sum(rate(rag_slo_requests_total{outcome="error"}[10m]))
            /
            sum(rate(rag_slo_requests_total[10m]))
          ) > 0.005
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "RAG availability below 99.5% SLO (10m)"
          description: "Error rate {{ $value | humanizePercentage }} over last 10m (target < 0.5%)."

      # Latency SLO: p95 request latency > 1.5s (configurable). Approximated with
      # histogram_quantile on rag_slo_latency_seconds.
      - alert: RAGLatencySLOBreach
        expr: |
          histogram_quantile(0.95, sum(rate(rag_slo_latency_seconds_bucket[10m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "RAG p95 latency above 1.5s SLO (10m)"
          description: "p95 = {{ $value }}s (target <= 1.5s)."

      # Degraded responses climbing: backends (Qdrant/embed/rerank) are impaired.
      - alert: RAGDegradedResponsesHigh
        expr: sum(rate(rag_degraded_responses_total[10m])) > 0.01
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "RAG serving degraded responses"
          description: "{{ $value | humanize }} degraded responses/s — a backend dependency is unhealthy."

      # A circuit breaker opened: dependency hard-down.
      - alert: RAGCircuitBreakerOpen
        expr: increase(rag_circuit_open_total[10m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "RAG circuit breaker opened for {{ $labels.dependency }}"
          description: "{{ $labels.dependency }} dependency marked unhealthy by the resilience layer."

      # Ingestion failures spiking.
      - alert: RAGIngestionFailing
        expr: |
          sum(rate(rag_ingest_jobs_total{status="failed"}[10m]))
          /
          sum(rate(rag_ingest_jobs_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "RAG ingestion failure rate > 10%"
          description: "{{ $value | humanizePercentage }} of ingestion jobs failed in the last 10m."

      # No-answer rate: queries returning safe no-answer (unanswerable/out-of-scope)
      # Threshold: > 20% of queries over 10m window indicates potential knowledge gap or
      # prompt issue. Investigate retrieval quality and embedder suitability.
      - alert: RAGNoAnswerHighRate
        expr: |
          sum(rate(rag_no_answer_total[10m]))
          /
          sum(rate(rag_requests_total[10m])) by (method, path) > 0.2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "RAG no-answer rate > 20% (10m)"
          description: "{{ $value | humanizePercentage }} of queries returned no-answer over last 10m — investigate retrieval quality, embedder suitability, or prompt design."

      # Faithfulness quality regression
      - alert: RAGFaithfulnessLowRate
        expr: |
          histogram_quantile(0.5, sum(rate(rag_faithfulness_bucket[10m])) by (le)) < 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "RAG faithfulness median below 0.5 (10m)"
          description: "{{ $value }} of queries have faithfulness < 0.5 over last 10m — investigate retrieval quality, context relevance, or answer grounding."

      # Rewrite usage anomaly
      - alert: RAGRewriteStuckRate
        expr: |
          sum(rate(rag_rewrite_used_total[10m])) by (method) > 0.8
          /
          sum(rate(rag_requests_total[10m])) by (method) > 0.8
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "RAG rewrite used on >80% of queries (10m)"
          description: "{{ $value | humanizePercentage }} of queries used rewrite over last 10m — investigate prompt design or whether rewrite is adding value."

      # No-response / timeout rate
      - alert: RAGNoResponseRate
        expr: |
          sum(rate(rag_no_response_total[10m])) / sum(rate(rag_requests_total[10m])) > 0.15
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "RAG no-response rate > 15% (10m)"
          description: "{{ $value | humanizePercentage }} of queries returned no response over last 10m — investigate backend timeouts, Qdrant latency, or rerank bottlenecks."