<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Chat</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --accent-text:#04263a; --txt:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 14px; background:var(--card); font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #brand-logo { height:22px; width:22px; object-fit:contain; border-radius:4px; display:none; }
  #brand-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #close { cursor:pointer; border:0; background:transparent; color:var(--txt); font-size:18px; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; line-height:1.45; }
  .user { align-self:flex-end; background:var(--accent); color:var(--accent-text); white-space:pre-wrap; word-wrap:break-word; }
  .bot { align-self:flex-start; background:var(--card); }
  /* Safe-markdown plain-text rendering (issue #7): no innerHTML, only textContent with visual markers. */
  .cite { display:inline-block; margin:2px 4px 0 0; font-size:11px; padding:1px 6px; border:1px solid #334155; border-radius:6px; text-decoration:none; color:var(--accent); }
  .cite:hover { background:var(--accent); color:var(--accent-text); }
  form { display:flex; gap:8px; padding:10px; background:var(--card); }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--txt); }
  button { padding:0 16px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-text); font-weight:600; }
  /* Thumbs up/down feedback (issue #29) */
  .feedback { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:#94a3b8; }
  .fb-btn { cursor:pointer; border:1px solid #334155; background:transparent; color:var(--txt);
            border-radius:6px; padding:2px 8px; font-size:13px; line-height:1; }
  .fb-btn:hover { border-color:var(--accent); }
  .fb-btn[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .fb-btn:disabled { opacity:0.55; cursor:default; }
  .fb-thanks { font-style:italic; }
  /* Human-handoff / lead capture card (issue #33) */
  .handoff { margin-top:8px; padding:10px 12px; border:1px solid #334155; border-radius:10px; background:#0b1626; }
  .handoff h4 { margin:0 0 6px; font-size:13px; color:var(--accent); }
  .handoff p.sub { margin:0 0 8px; font-size:12px; color:#94a3b8; }
  .handoff input, .handoff textarea { width:100%; margin:3px 0; padding:7px 8px; border-radius:7px;
    border:1px solid #334155; background:#0f172a; color:var(--txt); font:inherit; font-size:13px; box-sizing:border-box; }
  .handoff textarea { resize:vertical; min-height:48px; }
  .handoff button { margin-top:6px; padding:6px 14px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-text); font-weight:600; cursor:pointer; }
  .handoff .ok { color:#34d399; font-size:12px; font-style:italic; }
</style>
</head>
<body>
<header>
  <img id="brand-logo" alt="" />
  <span id="brand-title">RAG Chat</span>
  <button id="close">×</button>
</header>
<div id="log"></div>
<form id="form">
  <input id="q" autocomplete="off" placeholder="Ask a question…" />
  <button type="submit">Send</button>
</form>
<script>
/* Widget UI running inside the sandboxed iframe (PHASE C polish). Communicates with the
   embedding host page via postMessage and calls the RAG API directly (Bearer key is
   passed in from the host loader, never hardcoded here).

   PHASE C improvements:
   - Multi-turn: stable per-instance session_id, persisted in localStorage (issue #18).
   - Clickable citations: real links to source_url or hosted viewer (issue #20).
   - Safe Markdown rendering: plain-text transformation with visual markers (issue #7).
     The answer can be influenced by retrieved/poisoned documents, so we avoid innerHTML
     entirely and instead transform Markdown to a safer plain-text form that preserves
     emphasis via markers (bold, italic, code, links, headings). This is 100% XSS-safe
     because we never assign arbitrary strings to innerHTML. */

/* @rag-md-safe:start */
// Only allow http(s) URLs to become clickable links. Anything else is shown as plain text.
function safeHref(url) {
  if (typeof url !== "string") return null;
  try {
    var base = (typeof location !== "undefined" && location.origin) || "https://x";
    var u = new URL(url, base);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch (e) {}
  return null;
}

// Transform untrusted Markdown (LLM answers can echo poisoned retrieved docs) into XSS-safe
// HTML via a strict allow-list renderer. We NEVER assign raw strings to innerHTML; instead every
// text run is HTML-escaped and only a fixed set of safe tags is emitted. Links are restricted to
// http(s) by safeHref. This yields real formatting (bold/italic/code/links/headings/lists) without
// any script execution path.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// Inline-level Markdown -> safe HTML (called on already-escaped text for links' visible part).
function renderMarkdownInline(s) {
  var t = escapeHtml(s);
  t = t.replace(/`([^`\n]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  t = t.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
    var h = safeHref(url);
    return h
      ? '<a href="' + escapeHtml(h) + '" target="_blank" rel="noopener noreferrer">' + text + "</a>"
      : "[" + text + "](" + escapeHtml(url) + ")";
  });
  return t;
}

// Block-level Markdown -> safe HTML string (safe to assign to a container's innerHTML because
// every text node was escaped and only known tags are emitted).
function renderMarkdown(raw) {
  if (raw == null) return "";
  var s = String(raw);
  var blocks = [];
  s = s.replace(/```[^\n]*\n([\s\S]*?)```/g, function (_, body) {
    var idx = blocks.push("<pre><code>" + escapeHtml(body) + "</code></pre>") - 1;
    return " CODE" + idx + " ";
  });
  var lines = s.split("\n");
  var out = [], i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    var hm = ln.match(/^(#{1,3})\s+(.*)$/);
    if (hm) { out.push("<h" + hm[1].length + ">" + escapeHtml(hm[2]) + "</h" + hm[1].length + ">"); i++; continue; }
    if (/^>\s/.test(ln)) { out.push("<blockquote>" + renderMarkdownInline(ln.replace(/^>\s/, "")) + "</blockquote>"); i++; continue; }
    if (/^[-*]\s/.test(ln)) {
      var ul = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i])) { ul.push("<li>" + renderMarkdownInline(lines[i].replace(/^[-*]\s/, "")) + "</li>"); i++; }
      out.push("<ul>" + ul.join("") + "</ul>"); continue;
    }
    if (/^\d+\.\s/.test(ln)) {
      var ol = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) { ol.push("<li>" + renderMarkdownInline(lines[i].replace(/^\d+\.\s/, "")) + "</li>"); i++; }
      out.push("<ol>" + ol.join("") + "</ol>"); continue;
    }
    if (/^\s*$/.test(ln)) { i++; continue; }
    out.push("<p>" + renderMarkdownInline(ln) + "</p>"); i++;
  }
  var html = out.join("");
  html = html.replace(/ CODE(\d+) /g, function (_, k) { return blocks[+k]; });
  return html;
}

// Back-compat alias: callers that expected plain-text rendering now get formatted, safe HTML.
function renderMarkdownSafe(raw) { return renderMarkdown(raw); }
/* @rag-md-safe:end */

/* @rag-branding:start */
// Apply per-tenant branding to the widget via CSS custom properties + header UI (issue #23).
// GUARDS against injection: only the exact set of safe values is applied. accent/accent_text
// must be a valid CSS color; logo_url must be an http(s) URL (via safeHref); header_title is
// set via textContent (never innerHTML); font_family is validated to a narrow charset. No
// arbitrary style/cssText is ever assigned from tenant data.
var SAFE_CSS_COLOR = /^(#[0-9a-fA-F]{3,8}|rgb\(\s*\d{1,3}%?\s*,\s*\d{1,3}%?\s*,\s*\d{1,3}%?\s*\)|hsl\(\s*\d{1,3}\s*,\s*\d{1,3}%\s*,\s*\d{1,3}%\s*\))$/;
var SAFE_FONT = /^[A-Za-z0-9 ,'"\-]{1,120}$/;

function applyBranding(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  var root = document.documentElement;
  if (typeof cfg.accent === "string" && SAFE_CSS_COLOR.test(cfg.accent.trim())) {
    root.style.setProperty("--accent", cfg.accent.trim());
  }
  if (typeof cfg.accent_text === "string" && SAFE_CSS_COLOR.test(cfg.accent_text.trim())) {
    root.style.setProperty("--accent-text", cfg.accent_text.trim());
  }
  if (typeof cfg.font_family === "string" && SAFE_FONT.test(cfg.font_family)) {
    root.style.setProperty("--widget-font", cfg.font_family);
    document.body.style.fontFamily = cfg.font_family;
  }
  var logo = document.getElementById("brand-logo");
  if (logo) {
    var href = safeHref(cfg.logo_url);
    if (href) { logo.src = href; logo.style.display = "block"; }
    else { logo.removeAttribute("src"); logo.style.display = "none"; }
  }
  var title = document.getElementById("brand-title");
  if (title && typeof cfg.header_title === "string" && cfg.header_title.length) {
    title.textContent = cfg.header_title;  // textContent => no HTML injection
  }
}
/* @rag-branding:end */

var tenant = "", apiKey = "", base = "";
function loadSessionId() {
  try {
    var key = "rag-session:" + (tenant || "default");
    var existing = window.localStorage.getItem(key);
    if (existing) return existing;
    var id = "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    window.localStorage.setItem(key, id);
    return id;
  } catch (e) {
    return "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}
var sessionId = "";
var log = document.getElementById("log");

function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

// Build a clickable citation link (prefer external source_url, else hosted viewer).
function citationHref(s) {
  var ext = safeHref(s && s.url);
  if (ext) return ext;
  if (s && s.doc_id && tenant && base) {
    var root = base.replace(/\/api\/v1\/?$/, "");
    return root + "/doc/" + encodeURIComponent(tenant) + "/" + encodeURIComponent(s.doc_id) +
           "#token=" + encodeURIComponent(apiKey);
  }
  return null;
}

function addMsg(cls, text, sources, opts) {
  opts = opts || {};
  var d = el("div", "msg " + cls);
  var body = el("div", "bot-body");
  if (cls.indexOf("user") >= 0) {
    // User messages: plain textContent.
    body.textContent = text || "";
  } else {
    // Bot answer: XSS-safe formatted Markdown (allow-list renderer; every text node escaped).
    body.innerHTML = renderMarkdown(text || "");
  }
  d.appendChild(body);
  if (sources && sources.length) {
    var wrap = el("div");
    wrap.style.marginTop = "6px";
    sources.forEach(function (s, i) {
      var href = citationHref(s);
      var a = el("a", "cite");
a.textContent = "[" + (i + 1) + "] " + escapeText(s.title || "source");
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.title = s.url || "Open source"; }
      else { a.removeAttribute("href"); a.title = "source"; }
      wrap.appendChild(a);
    });
    d.appendChild(wrap);
  }
  // PHASE D (#29): thumbs up/down feedback capture under each bot answer.
  if (cls.indexOf("bot") >= 0 && opts.feedback !== false) {
    d.appendChild(addFeedback(opts.question, opts.answer));
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// Build the 👍/👎 control. Posts to POST /{tenant}/feedback (tenant secret key).
function addFeedback(question, answer) {
  var row = el("div", "feedback");
  var label = el("span"); label.textContent = "Was this helpful?";
  var up = el("button", "fb-btn"); up.type = "button"; up.textContent = "\u{1F44D}"; up.setAttribute("aria-label", "Thumbs up");
  var down = el("button", "fb-btn"); down.type = "button"; down.textContent = "\u{1F44E}"; down.setAttribute("aria-label", "Thumbs down");
  var thanks = el("span", "fb-thanks");

  function submit(rating, btn) {
    up.disabled = true; down.disabled = true;
    up.setAttribute("aria-pressed", String(btn === up));
    down.setAttribute("aria-pressed", String(btn === down));
    thanks.textContent = " Thanks!";
    row.appendChild(thanks);
    if (!tenant || !apiKey || !base) return; // can't reach the API; keep UI state only
    fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/feedback", {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        rating: rating,
        session_id: sessionId || undefined,
        question: question || undefined,
        answer: answer || undefined,
      }),
    }).catch(function () { /* best-effort: UI already reflects the choice */ });
  }

  up.onclick = function () { submit("up", up); };
  down.onclick = function () { submit("down", down); };
  row.appendChild(label);
  row.appendChild(up);
  row.appendChild(down);
  return row;
}

// Human-handoff / lead-capture card (issue #33). Shown when a query is out-of-scope so a
// lost answer becomes a follow-up lead. Posts to POST /{tenant}/handoff.
function showHandoff(question) {
  var d = el("div", "msg bot");
  var card = el("div", "handoff");
  var h = el("h4"); h.textContent = "Didn't find what you needed?";
  var sub = el("p", "sub"); sub.textContent = "Leave your details and we'll get back to you.";
  var name = el("input"); name.type = "text"; name.placeholder = "Your name (optional)";
  var email = el("input"); email.type = "email"; email.placeholder = "Email *";
  var msg = el("textarea"); msg.placeholder = "Anything else? (optional)";
  // prefill the message with the original question for context
  msg.value = question ? "Re: " + question : "";
  var btn = el("button", "fb-btn"); btn.type = "button"; btn.textContent = "Send";
  var ok = el("span", "ok");

  function submit() {
    var payload = {
      question: question || undefined,
      name: name.value.trim() || undefined,
      email: email.value.trim() || undefined,
      message: msg.value.trim() || undefined,
      session_id: sessionId || undefined,
    };
    btn.disabled = true;
    if (!tenant || !apiKey || !base) { ok.textContent = " Thanks — we'll follow up."; card.appendChild(ok); return; }
    fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/handoff", {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function () { ok.textContent = " Thanks — we'll follow up."; card.appendChild(ok); })
      .catch(function () { ok.textContent = " Couldn't send; please email support."; card.appendChild(ok); });
  }
  btn.onclick = submit;

  card.appendChild(h);
  card.appendChild(sub);
  card.appendChild(name);
  card.appendChild(email);
  card.appendChild(msg);
  card.appendChild(btn);
  d.appendChild(card);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("close").onclick = function () {
  parent.postMessage({ type: "rag:toggle", open: false }, "*");
};
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "rag:config") {
    tenant = e.data.tenant; apiKey = e.data.apiKey; base = e.data.base;
    if (!sessionId) sessionId = loadSessionId();
    parent.postMessage({ type: "rag:toggle", open: true }, "*");
    // Fetch per-tenant branding and theme the widget (issue #23). Best-effort: failures
    // leave the default theme in place.
    if (tenant && apiKey && base) {
      fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/widget/config", {
        method: "GET",
        headers: { "Authorization": "Bearer " + apiKey },
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) { if (cfg && cfg.branding) applyBranding(cfg.branding); })
        .catch(function () {});
      // PHASE D (#31): replay prior conversation so a reload doesn't lose context.
      if (sessionId) loadHistory(sessionId);
    }
  }
});

// Fetch and render stored multi-turn history for a session (issue #31). Historical bot
// answers are shown without the feedback controls (those only apply to fresh answers).
function loadHistory(sid) {
  if (!tenant || !apiKey || !base) return;
  fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/session/" + encodeURIComponent(sid), {
    method: "GET",
    headers: { "Authorization": "Bearer " + apiKey },
  })
    .then(function (r) { return r.ok ? r.json() : { turns: [] }; })
    .then(function (data) {
      var turns = (data && data.turns) || [];
      turns.forEach(function (t) {
        if (t.role === "user") addMsg("user", t.text, null, { feedback: false });
        else addMsg("bot", t.text || "", null, { feedback: false });
      });
    })
    .catch(function () {});
}
parent.postMessage({ type: "rag:ready" }, "*");

document.getElementById("form").onsubmit = async function (ev) {
  ev.preventDefault();
  var q = document.getElementById("q").value.trim();
  if (!q || !apiKey) return;
  document.getElementById("q").value = "";
  addMsg("user", q);
  var bot = addMsg("bot", "…");
  var answer = "", sources = [];
  try {
    var resp = await fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/query/stream", {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, generate: true, top_k: 4, session_id: sessionId })
    });
    if (!resp.ok) { bot.textContent = "Error: " + resp.status; return; }
    var reader = resp.body.getReader(), decoder = new TextDecoder(), buf = "";
    var doneData = null;
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += decoder.decode(r.value, { stream: true });
      var parts = buf.split("\n\n"); buf = parts.pop();
      for (var p of parts) {
        var m = p.match(/^event: (\w+)\ndata: (.*)$/s);
        if (!m) continue;
        var ev = m[1], data = JSON.parse(m[2]);
        if (ev === "sources") { sources = data || []; }
        else if (ev === "token") { answer += data; bot.textContent = answer; log.scrollTop = log.scrollHeight; }
        else if (ev === "done") { doneData = data; }
        function renderWidgetError(data) {
  // Backend now sends {error, error_type, code?, status?, detail?}
  // Show meaningful diagnostics instead of "Error: unknown"
  if (data && data.error) {
    var msg = String(data.error).trim();
    // If the error is a generic type name, use error_type for better diagnostics
    if (msg === "HTTPException" || msg === "RagError" || msg === "ValidationError") {
      var errType = data.error_type || "Error";
      bot.textContent = "Error: " + errType + " — " + msg;
    } else {
      bot.textContent = "Error: " + msg;
    }
    return;
  }
  // No error detail available — prompt operator to check backend logs
  bot.textContent = "Error: query failed — check backend logs for details";
}

        else if (ev === "error") { renderWidgetError(data); }
      }
    }
    addMsg("bot", answer || "(no answer)", sources, { question: q, answer: answer });
    bot.remove();
    // PHASE D (#33): a genuinely out-of-scope answer (not an injection block) is a lost query
    // -> offer a human-handoff / lead-capture card so the business can follow up.
    if (doneData && doneData.out_of_scope && !doneData.injection_detected) {
      showHandoff(q);
    }
  } catch (e) { bot.textContent = "Network error."; }
};
</script>
</body>
</html>
