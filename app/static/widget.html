<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Chat</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --txt:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 14px; background:var(--card); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  #close { cursor:pointer; border:0; background:transparent; color:var(--txt); font-size:18px; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#04263a; }
  .bot { align-self:flex-start; background:var(--card); }
  .bot a { color:var(--accent); }
  .cite { display:inline-block; margin:2px 4px 0 0; font-size:11px; padding:1px 6px; border:1px solid #334155; border-radius:6px; text-decoration:none; color:var(--accent); }
  .cite:hover { background:#0ea5e9; color:#04263a; }
  form { display:flex; gap:8px; padding:10px; background:var(--card); }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--txt); }
  button { padding:0 16px; border:0; border-radius:8px; background:var(--accent); color:#04263a; font-weight:600; }
</style>
</head>
<body>
<header>RAG Chat <button id="close">×</button></header>
<div id="log"></div>
<form id="form">
  <input id="q" autocomplete="off" placeholder="Ask a question…" />
  <button type="submit">Send</button>
</form>
<script>
/* Widget UI running inside the sandboxed iframe (PHASE C polish). Communicates with the
   embedding host page via postMessage and calls the RAG API directly (Bearer key is
   passed in from the host loader, never hardcoded here).

   PHASE C improvements over v9-3:
   - Multi-turn: a stable per-instance session_id is sent with every turn so the server can
     rewrite/clarify follow-ups against conversation history (session store already exists).
   - Clickable citations: the `sources` SSE event carries {chunk_id,title,url,snippet}; we
     render each as <a> so users can jump to the source.
   - Safe rendering: ALL untrusted text (answer, titles, snippets, URLs) is set via
     textContent / a validated href — never innerHTML — so a hostile document snippet cannot
     inject script. URLs are restricted to http(s) before becoming an href. */
var tenant = "", apiKey = "", base = "";
// Stable session id: persisted in localStorage per-tenant so a conversation SURVIVES page
// reloads (true multi-turn persistence on the client). Falls back to a random id if storage
// is unavailable (private mode / file://).
function loadSessionId() {
  try {
    var key = "rag-session:" + (tenant || "default");
    var existing = window.localStorage.getItem(key);
    if (existing) return existing;
    var id = "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    window.localStorage.setItem(key, id);
    return id;
  } catch (e) {
    return "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}
var sessionId = "";  // assigned once the tenant is known (see onConfig)
var log = document.getElementById("log");

function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

// Only allow http(s) URLs to become clickable links. Anything else is shown as plain text.
function safeHref(url) {
  if (typeof url !== "string") return null;
  try {
    var u = new URL(url, location.origin);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch (e) { /* not a valid URL */ }
  return null;
}

function escapeText(s) { return s == null ? "" : String(s); }

function addMsg(cls, text, sources) {
  var d = el("div", "msg " + cls);
  d.textContent = text || "";
  if (sources && sources.length) {
    var wrap = el("div");
    wrap.style.marginTop = "6px";
    sources.forEach(function (s, i) {
      var href = safeHref(s.url);
      var a = el("a", "cite");
      a.textContent = "[" + (i + 1) + "] " + (s.title || "source");
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      else { a.removeAttribute("href"); }
      wrap.appendChild(a);
    });
    d.appendChild(wrap);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

document.getElementById("close").onclick = function () {
  parent.postMessage({ type: "rag:toggle", open: false }, "*");
};
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "rag:config") {
    tenant = e.data.tenant; apiKey = e.data.apiKey; base = e.data.base;
    if (!sessionId) sessionId = loadSessionId();  // stable, persisted per tenant
    parent.postMessage({ type: "rag:toggle", open: true }, "*");
  }
});
// Tell the loader we're ready so it can push config.
parent.postMessage({ type: "rag:ready" }, "*");

document.getElementById("form").onsubmit = async function (ev) {
  ev.preventDefault();
  var q = document.getElementById("q").value.trim();
  if (!q || !apiKey) return;
  document.getElementById("q").value = "";
  addMsg("user", q);
  var bot = addMsg("bot", "…");
  var answer = "", sources = [];
  try {
    var resp = await fetch(base.replace(/\/$/, "") + "/" + encodeURIComponent(tenant) + "/query/stream", {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      // session_id drives multi-turn rewriting; publishable key is query-scoped (PHASE C).
      body: JSON.stringify({ question: q, generate: true, top_k: 4, session_id: sessionId })
    });
    if (!resp.ok) { bot.textContent = "Error: " + resp.status; return; }
    var reader = resp.body.getReader(), decoder = new TextDecoder(), buf = "";
    while (true) {
      var { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      var parts = buf.split("\n\n"); buf = parts.pop();
      for (var p of parts) {
        var m = p.match(/^event: (\w+)\ndata: (.*)$/s);
        if (!m) continue;
        var ev = m[1], data = JSON.parse(m[2]);
        if (ev === "sources") { sources = data || []; }
        else if (ev === "token") { answer += data; bot.textContent = answer; log.scrollTop = log.scrollHeight; }
        else if (ev === "error") { bot.textContent = "Error: " + (data.error || "unknown"); }
      }
    }
    // Re-render with citations once the full answer (and sources) are known.
    addMsg("bot", answer || "(no answer)", sources);
    bot.remove();
  } catch (e) { bot.textContent = "Network error."; }
};
</script>
</body>
</html>
